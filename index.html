<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELESAI - Memoar Sirosis Mantan Aktivis</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
        }
        /* Halaman Depan / Hook */
        #landing-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
        }
        .hook-container {
            max-width: 700px;
            animation: fadeIn 1.5s ease-in-out;
        }
        .hook-container h1 {
            font-size: 1.8rem;
            font-weight: 400;
            color: #b0bec5;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .hook-container p {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .btn-buka {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
        }
        .btn-buka:hover {
            background-color: #b71c1c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.6);
        }
        /* Bagian Isi Buku (Awalnya Disembunyikan) */
        #main-content {
            display: none;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- LANDING PAGE / HOOK -->
    <div id="landing-page">
        <div class="hook-container">
            <h1>SELESAI: Memoar Sirosis Mantan Aktivis</h1>
            <p>“Bagaimana rasanya hidup dengan vonis mematikan, sementara di luar sana dunia tetap berjalan seolah tidak ada yang terjadi?”</p>
            <button class="btn-buka" onclick="bukaBuku()">Buka Memoar</button>
        </div>
    </div>

    <!-- ISI BUKU / KONTEN UTAMA -->
    <div id="main-content">
        <h1>Selamat Membaca</h1>
        <p>Isi buku atau cover Anda akan tampil di sini setelah tombol diklik.</p>
    </div>

    <script>
        function bukaBuku() {
            // Sembunyikan halaman depan
            document.getElementById('landing-page').style.display = 'none';
            // Tampilkan isi buku
            document.getElementById('main-content').style.display = 'block';
            // Gulir ke atas otomatis
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
